[tool.poetry]
name = "fpl-analytics"
version = "0.1.0"
description = "Local FPL analytics pipeline and Streamlit dashboard"
authors = ["duman"]
readme = "README.md"
packages = [
    { include = "fpl_analytics" },
    { include = "dashboard" },
]

[tool.poetry.dependencies]
python = "^3.11"
duckdb = ">=1.0.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
requests = ">=2.32.0"
streamlit = ">=1.38.0"
altair = ">=5.3.0"

[tool.poetry.scripts]
fpl-pipeline = "fpl_analytics.cli:run_pipeline"
fpl-dashboard = "fpl_analytics.cli:run_dashboard"
fpl-backtest = "fpl_analytics.backtest.run:main"
fpl-refresh = "fpl_analytics.refresh:main"
fpl-schedule = "fpl_analytics.schedule:main"
fpl-publish = "fpl_analytics.publish:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
